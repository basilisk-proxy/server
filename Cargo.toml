[package]
name = "basilisk"
authors = ["oluwatobi.johnson@getmoovable.com"]
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13.1", features = ["v4", "v7", "serde"] }
axum = "0.8.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1.0"
hyper-util = { version = "0.1.10", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.5", features = ["http1", "http2", "webpki-roots"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rand = "0.10.1"
mlua = { version = "0.11.6", features = ["vendored", "send", "luajit"] }
base64 = "0.22"
redis = "1.2.1"
memcache = "0.19.0"
smallvec = "1.15.1"
