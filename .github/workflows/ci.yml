name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout rust-client dependency repository
        uses: actions/checkout@v4
        with:
          repository: basilisk-proxy/rust-client
          path: rust-client-dependency

      - name: Wire rust-client into expected relative path
        run: |
          ln -sfn "$GITHUB_WORKSPACE/rust-client-dependency" "$GITHUB_WORKSPACE/../rust-client"
          test -d "$GITHUB_WORKSPACE/../rust-client"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust test suite
        run: cargo test -- --nocapture

      - name: Compile-check benchmark tiny service
        run: cargo check --manifest-path benchmarks/tiny-rust-client-service/Cargo.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate summary script syntax
        run: python3 -m py_compile benchmarks/scripts/summarize_roundtrip_results.py

      - name: Run real round-trip benchmark suite
        run: |
          BENCH_VUS=10 \
          BENCH_DURATION=10s \
          BENCH_PAYLOAD_BYTES=4096 \
          BENCH_POST_RATIO=0.7 \
          BENCH_READY_TIMEOUT_SEC=180 \
          ./benchmarks/scripts/run_roundtrip_benchmarks.sh

      - name: Generate markdown summary from real benchmark results
        run: |
          python3 benchmarks/scripts/summarize_roundtrip_results.py \
            --results-dir benchmarks/results \
            --output benchmarks/results/roundtrip-report.md

      - name: Validate JSON summary + p95 regression gate on real results
        run: |
          python3 benchmarks/scripts/summarize_roundtrip_results.py \
            --results-dir benchmarks/results \
            --format json \
            --max-p95-regression-percent 150 \
            --output benchmarks/results/roundtrip-report.json

      - name: Print benchmark markdown report in logs
        run: |
          echo "---- benchmark round-trip report (real CI run) ----"
          cat benchmarks/results/roundtrip-report.md

      - name: Publish benchmark report to job summary
        run: |
          {
            echo "## CI Benchmark Summary Validation"
            echo
            echo "Generated from real CI round-trip benchmark execution."
            echo
            cat benchmarks/results/roundtrip-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build PR benchmark comment body
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## CI Benchmark Summary Validation"
            echo
            echo "Generated from real CI round-trip benchmark execution."
            echo
            cat benchmarks/results/roundtrip-report.md
          } > benchmarks/results/pr-comment.md

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: roundtrip-benchmark-validation
          path: benchmarks/results/pr-comment.md

      - name: Upload benchmark summary report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary-report
          path: |
            benchmarks/results/*-roundtrip-summary.json
            benchmarks/results/roundtrip-report.md
            benchmarks/results/roundtrip-report.json
            benchmarks/results/pr-comment.md
